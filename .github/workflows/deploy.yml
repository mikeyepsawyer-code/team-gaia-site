name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site directory (exclude repo internals and oversized files)
        run: |
          mkdir -p /tmp/site
          rsync -a --exclude='.git' --exclude='.github' --exclude='hook-response.txt' --exclude='deploy-log.txt' . /tmp/site/
          find /tmp/site -type f -size +24M -print -delete
      - name: Direct upload via wrangler
        run: |
          npx wrangler@3 pages deploy /tmp/site --project-name=team-gaia-site --branch=main --commit-dirty=true > deploy-log.txt 2>&1 || true
          cat deploy-log.txt
          git config user.name "deploy-bot"
          git config user.email "deploy-bot@users.noreply.github.com"
          git add deploy-log.txt
          git commit -m "Record wrangler deploy log [skip ci]" || true
          git push
