<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
<style>
  body { background:#0a0806; margin:0; padding:60px 20px; text-align:center; }

  /* ONE element. No shadow-copy/rim-copy. No animated background-position. */
  .shimmer-simple {
    font-family: 'Cinzel', serif;
    font-weight: 700;

    /* static gradient - not animated, so it can't get "stuck" mid-sweep */
    background: linear-gradient(100deg,
      #6e4218 0%, #a5732a 12%, #e6b64c 24%, #fff2c0 34%,
      #f2a13c 44%, #c99435 54%, #7a4a1e 64%, #e6b64c 76%,
      #fff2c0 86%, #c99435 96%, #6e4218 100%);
    background-size: 100% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;

    animation: gold-pulse 4s ease-in-out infinite;
  }

  /* bevel + shimmer, all via filter, all on the one element */
  @keyframes gold-pulse {
    0%, 100% {
      filter:
        brightness(0.94) saturate(0.92)
        drop-shadow(0.035em 0.035em 0 rgba(20, 10, 5, 0.85))
        drop-shadow(-0.02em -0.02em 0 rgba(255, 230, 165, 0.65))
        drop-shadow(0 0 0.05em rgba(210, 160, 80, 0.18));
    }
    50% {
      filter:
        brightness(1.18) saturate(1.12)
        drop-shadow(0.035em 0.035em 0 rgba(20, 10, 5, 0.85))
        drop-shadow(-0.02em -0.02em 0 rgba(255, 235, 180, 0.85))
        drop-shadow(0 0 0.09em rgba(240, 195, 110, 0.32));
    }
  }

  h1 { letter-spacing:0.08em; line-height:1.3; margin: 0 0 20px 0; font-size: 4.5rem; }
  p.label { letter-spacing:0.08em; line-height:1.3; margin: 40px 0 0 0; font-size: 4rem; }
</style>
</head>
<body>

  <h1 class="shimmer-simple">Human</h1>
  <h1 class="shimmer-simple">Thriving</h1>
  <p class="label shimmer-simple">Books</p>

</body>
</html>
