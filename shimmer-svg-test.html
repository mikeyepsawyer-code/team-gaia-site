<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
<style>
  body { background:#0a0806; margin:0; padding:40px 10px; text-align:center; }
  svg { display:block; margin:0 auto; overflow:visible; max-width:100%; }
  text {
    font-family: 'Cinzel', serif;
    font-weight: 700;
    paint-order: fill stroke;
  }
  .word-wrap { margin-bottom: 20px; }
</style>
</head>
<body>

  <div class="word-wrap">
  <svg viewBox="0 0 900 160" width="100%" height="140">
    <defs>
      <linearGradient id="goldFillHuman" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
        <stop offset="0%"  stop-color="#4a2418"/>
        <stop offset="18%" stop-color="#e6b64c"/>
        <stop offset="26%" stop-color="#fff2c0"/>
        <stop offset="38%" stop-color="#7a4a1e"/>
        <stop offset="50%" stop-color="#fff2c0"/>
        <stop offset="64%" stop-color="#6e4218"/>
        <stop offset="82%" stop-color="#fff2c0"/>
        <stop offset="100%" stop-color="#4a2418"/>
        <animateTransform attributeName="gradientTransform" type="translate"
          values="-0.4 0; 0.4 0; -0.4 0" dur="6s" repeatCount="indefinite" additive="sum"/>
      </linearGradient>
      <linearGradient id="bevelHuman" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="#fff6d8"/>
        <stop offset="42%" stop-color="#c99435"/>
        <stop offset="58%" stop-color="#3a2010"/>
        <stop offset="100%" stop-color="#0f0904"/>
      </linearGradient>
    </defs>
    <text x="450" y="115" font-size="110" text-anchor="middle"
          fill="url(#goldFillHuman)" stroke="url(#bevelHuman)" stroke-width="3">Human</text>
  </svg>
  </div>

  <div class="word-wrap">
  <svg viewBox="0 0 900 160" width="100%" height="120">
    <defs>
      <linearGradient id="goldFillThriving" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
        <stop offset="0%"  stop-color="#4a2418"/>
        <stop offset="18%" stop-color="#e6b64c"/>
        <stop offset="26%" stop-color="#fff2c0"/>
        <stop offset="38%" stop-color="#7a4a1e"/>
        <stop offset="50%" stop-color="#fff2c0"/>
        <stop offset="64%" stop-color="#6e4218"/>
        <stop offset="82%" stop-color="#fff2c0"/>
        <stop offset="100%" stop-color="#4a2418"/>
        <animateTransform attributeName="gradientTransform" type="translate"
          values="-0.4 0; 0.4 0; -0.4 0" dur="6s" repeatCount="indefinite" additive="sum"/>
      </linearGradient>
      <linearGradient id="bevelThriving" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="#fff6d8"/>
        <stop offset="42%" stop-color="#c99435"/>
        <stop offset="58%" stop-color="#3a2010"/>
        <stop offset="100%" stop-color="#0f0904"/>
      </linearGradient>
    </defs>
    <text x="450" y="100" font-size="80" text-anchor="middle"
          fill="url(#goldFillThriving)" stroke="url(#bevelThriving)" stroke-width="2.5">Thriving</text>
  </svg>
  </div>

  <div class="word-wrap">
  <svg viewBox="0 0 500 100" width="70%" height="80" style="max-width:400px;">
    <defs>
      <linearGradient id="goldFillBooks" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="objectBoundingBox">
        <stop offset="0%"  stop-color="#4a2418"/>
        <stop offset="18%" stop-color="#e6b64c"/>
        <stop offset="26%" stop-color="#fff2c0"/>
        <stop offset="38%" stop-color="#7a4a1e"/>
        <stop offset="50%" stop-color="#fff2c0"/>
        <stop offset="64%" stop-color="#6e4218"/>
        <stop offset="82%" stop-color="#fff2c0"/>
        <stop offset="100%" stop-color="#4a2418"/>
        <animateTransform attributeName="gradientTransform" type="translate"
          values="-0.4 0; 0.4 0; -0.4 0" dur="6s" repeatCount="indefinite" additive="sum"/>
      </linearGradient>
      <linearGradient id="bevelBooks" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%"  stop-color="#fff6d8"/>
        <stop offset="42%" stop-color="#c99435"/>
        <stop offset="58%" stop-color="#3a2010"/>
        <stop offset="100%" stop-color="#0f0904"/>
      </linearGradient>
    </defs>
    <text x="250" y="70" font-size="60" text-anchor="middle"
          fill="url(#goldFillBooks)" stroke="url(#bevelBooks)" stroke-width="2">Books</text>
  </svg>
  </div>

</body>
</html>
