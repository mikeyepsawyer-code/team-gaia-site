<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hardcover demo — continuous headband</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&display=swap" rel="stylesheet">
<style>
body{background:#0d0d0d;color:#c9a84c;font-family:'Cinzel',serif;padding:40px 18px;text-align:center}
h3{font-size:0.7rem;letter-spacing:0.2em;opacity:0.7;margin:34px 0 34px;text-transform:uppercase}
.row{display:flex;gap:52px;justify-content:center;flex-wrap:wrap}
.card{width:170px}

/* ---- 45° oblique HARDCOVER — depth 10px ---- */
.book{position:relative;margin-top:26px;margin-left:22px}

/* front board: top edge is the cover's own cloth (spine color) under the
   gold hairline — no more grey. Top-left corner SQUARE so the edge
   continues around onto the spine top as one piece of material. */
.book .img{position:relative;z-index:2;top:-7px;left:-2px;
  width:calc(100% + 4px);aspect-ratio:2/3;overflow:hidden;
  border-top:3px solid var(--spine,#3a2d14);
  border-left:1px solid rgba(201,168,76,0.4);
  border-right:1px solid rgba(201,168,76,0.2);
  border-bottom:1px solid rgba(201,168,76,0.2);
  border-radius:0 4px 4px 4px;
  box-shadow:0 -1px 0 rgba(201,168,76,0.55), 2px 5px 12px rgba(0,0,0,0.45)}
.book .img img{width:100%;height:100%;object-fit:cover;display:block}

/* top face: rim now solid gold + board only — the translucent highlight
   that was sliding off to the right is gone. Right edge trimmed 2px. */
.book::before{content:'';position:absolute;top:-17px;height:10px;left:-2px;right:-4px;z-index:1;
  transform:skewX(45deg);transform-origin:bottom left;
  border-radius:2px 4px 2px 2px;
  background:
    linear-gradient(180deg,
      rgba(201,168,76,0.7) 0 1px,
      var(--spine2,#241b10) 1px 3.5px,
      rgba(240,231,205,0) 3.5px),
    linear-gradient(0deg, rgba(50,38,16,0.45) 0, rgba(50,38,16,0) 65%),
    linear-gradient(0deg,
      transparent 0 2px, rgba(175,160,120,0.5) 2px 2.6px,
      transparent 2.6px 4.5px, rgba(175,160,120,0.4) 4.5px 5.1px,
      transparent 5.1px),
    linear-gradient(#ece3c8,#ece3c8);
  background-size:100% 100%, calc(100% - 7px) 100%, calc(100% - 7px) 100%, calc(100% - 7px) 100%;
  background-position:left top;background-repeat:no-repeat}

/* spine: hinge-top corner SQUARE, meeting the cover's square corner —
   the board edge bends around: same gold hairline + cloth band runs the
   slanted cap. Only the outer tip is softened, curving down over the
   back board (true convex). */
.book::after{content:'';position:absolute;left:-12px;width:10px;top:-12px;bottom:12px;
  border-radius:2px 3px 3px 0 / 2px 2px 2px 0;
  transform:rotate(180deg) skewY(45deg);transform-origin:center;
  background:
    linear-gradient(0deg,
      rgba(201,168,76,0.7) 0 1px,
      color-mix(in srgb, var(--spine,#3a2d14) 72%, #cdbd8e) 1px 3px,
      transparent 3px),
    linear-gradient(90deg,
      rgba(20,14,6,0.9) 0 1.5px,
      var(--spine,#3a2d14) 1.5px 3px,
      color-mix(in srgb, var(--spine,#3a2d14) 78%, #fff8e0) 4.5px 6.5px,
      var(--spine,#3a2d14) 7px 9px,
      rgba(201,168,76,0.45) 9px 10px);
  box-shadow:-4px 8px 18px rgba(0,0,0,0.55)}

/* flat comparison */
.flat .img{aspect-ratio:2/3;overflow:hidden;border:1px solid rgba(201,168,76,0.25);border-radius:4px}
.flat .img img{width:100%;height:100%;object-fit:cover;display:block}
</style></head><body>
